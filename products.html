<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stockroom — Products</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="brand">STOCK<span>ROOM</span></div>
    <nav class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="products.html" class="active">Products</a>
      <a href="product-form.html">Add Product</a>
    </nav>
  </aside>

  <main>
    <h1>Products</h1>
    <p class="subtitle">Every item currently tracked in the stockroom.</p>

    <div class="panel">
      <div class="panel-header">
        <span id="countLabel">— items</span>
        <a href="product-form.html" class="btn btn-primary btn-sm">+ Add product</a>
      </div>
      <div class="table-wrap"><table>
        <thead>
          <tr>
            <th>Product</th><th>SKU</th><th>Category</th>
            <th>Qty</th><th>Unit price</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody id="productBody"></tbody>
      </table></div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="repository.js"></script>
  <script>
    function peso(n) {
      return "₱" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2200);
    }

    function render() {
      const products = InventoryRepository.getAll();
      document.getElementById("countLabel").textContent = `${products.length} item${products.length === 1 ? "" : "s"}`;

      const body = document.getElementById("productBody");
      if (products.length === 0) {
        body.innerHTML = `<tr><td colspan="7" class="empty-state">No products yet. Add your first one.</td></tr>`;
        return;
      }

      body.innerHTML = products.map(p => {
        const isLow = Number(p.quantity) <= Number(p.reorderLevel);
        return `
          <tr>
            <td>${p.name}</td>
            <td class="sku">${p.sku}</td>
            <td><span class="tag">${p.category}</span></td>
            <td class="num ${isLow ? 'low' : ''}">${p.quantity}</td>
            <td class="num">${peso(p.unitPrice)}</td>
            <td>${isLow ? '<span class="tag low-tag">Reorder</span>' : '<span class="tag">OK</span>'}</td>
            <td>
              <div class="row-actions">
                <a class="btn btn-sm" href="product-form.html?id=${p.id}">Edit</a>
                <button class="btn btn-sm btn-danger" onclick="handleDelete('${p.id}', '${p.name.replace(/'/g, "\\'")}')">Delete</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    function handleDelete(id, name) {
      if (!confirm(`Delete "${name}"? This can't be undone.`)) return;
      InventoryRepository.remove(id);
      showToast(`Deleted "${name}"`);
      render();
    }

    render();
  </script>
</body>
</html>
