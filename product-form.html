<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stockroom — Add/Edit Product</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="brand">STOCK<span>ROOM</span></div>
    <nav class="nav-links">
      <a href="index.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="product-form.html" class="active">Add Product</a>
    </nav>
  </aside>

  <main>
    <h1 id="pageTitle">Add product</h1>
    <p class="subtitle" id="pageSubtitle">Add a new item to the stockroom.</p>

    <form class="card form-card" id="productForm">
      <div class="field">
        <label for="name">Product name</label>
        <input type="text" id="name" required placeholder="e.g. Steel Bolt M8x40">
      </div>
      <div class="field">
        <label for="sku">SKU</label>
        <input type="text" id="sku" required placeholder="e.g. HW-1001">
        <div class="field-error" id="skuError">That SKU is already used by another product.</div>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <input type="text" id="category" required placeholder="e.g. Hardware">
      </div>
      <div class="field">
        <label for="quantity">Quantity on hand</label>
        <input type="number" id="quantity" min="0" required placeholder="0">
      </div>
      <div class="field">
        <label for="reorderLevel">Reorder level</label>
        <input type="number" id="reorderLevel" min="0" required placeholder="0">
      </div>
      <div class="field">
        <label for="unitPrice">Unit price (₱)</label>
        <input type="number" id="unitPrice" min="0" step="0.01" required placeholder="0.00">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="submitBtn">Save product</button>
        <a href="products.html" class="btn">Cancel</a>
      </div>
    </form>
  </main>

  <script src="repository.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const editId = params.get("id");
    const form = document.getElementById("productForm");

    const skuField = document.getElementById("sku").closest(".field");

    if (editId) {
      const product = InventoryRepository.getById(editId);
      if (product) {
        document.getElementById("pageTitle").textContent = "Edit product";
        document.getElementById("pageSubtitle").textContent = `Editing "${product.name}".`;
        document.getElementById("submitBtn").textContent = "Update product";
        document.getElementById("name").value = product.name;
        document.getElementById("sku").value = product.sku;
        document.getElementById("category").value = product.category;
        document.getElementById("quantity").value = product.quantity;
        document.getElementById("reorderLevel").value = product.reorderLevel;
        document.getElementById("unitPrice").value = product.unitPrice;
      } else {
        // Bad or stale link: don't fall through to a blank "add" form.
        document.getElementById("pageTitle").textContent = "Product not found";
        document.getElementById("pageSubtitle").textContent = "It may have been deleted. Head back to the products list.";
        form.innerHTML = `<div class="form-actions"><a href="products.html" class="btn btn-primary">Back to products</a></div>`;
      }
    }

    // Clear the error as soon as the user edits the SKU.
    document.getElementById("sku").addEventListener("input", () => skuField.classList.remove("has-error"));

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById("name").value.trim(),
        sku: document.getElementById("sku").value.trim(),
        category: document.getElementById("category").value.trim(),
        quantity: Number(document.getElementById("quantity").value),
        reorderLevel: Number(document.getElementById("reorderLevel").value),
        unitPrice: Number(document.getElementById("unitPrice").value)
      };

      // On update, the product's own current SKU doesn't count as a clash.
      if (InventoryRepository.skuExists(data.sku, editId)) {
        skuField.classList.add("has-error");
        document.getElementById("sku").focus();
        return;
      }

      if (editId) {
        const updated = InventoryRepository.update(editId, data);
        if (!updated) { alert("This product no longer exists."); window.location.href = "products.html"; return; }
        sessionStorage.setItem("stockroom_flash", `Updated "${updated.name}"`);
      } else {
        InventoryRepository.add(data);
        sessionStorage.setItem("stockroom_flash", `Added "${data.name}"`);
      }
      window.location.href = "products.html";
    });
  </script>
</body>
</html>
