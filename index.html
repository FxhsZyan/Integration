<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stockroom — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="brand">STOCK<span>ROOM</span></div>
    <nav class="nav-links">
      <a href="index.html" class="active">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="product-form.html">Add Product</a>
    </nav>
  </aside>

  <main>
    <h1>Dashboard</h1>
    <p class="subtitle">Snapshot of what's on the shelves right now.</p>

    <!-- Static placeholder values. Real numbers will come from the backend later. -->
    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Total products</div>
        <div class="value">5</div>
      </div>
      <div class="stat-card">
        <div class="label">Units in stock</div>
        <div class="value">424</div>
      </div>
      <div class="stat-card warning">
        <div class="label">Low stock alerts</div>
        <div class="value">2</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>Needs reordering</span>
        <a href="products.html" class="btn btn-sm">View all products</a>
      </div>
      <table>
        <thead>
          <tr><th>Product</th><th>SKU</th><th>On hand</th><th>Reorder at</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>Cable Tie 200mm</td>
            <td class="sku">HW-1042</td>
            <td class="num low">18</td>
            <td class="num">30</td>
          </tr>
          <tr>
            <td>A4 Bond Paper (Ream)</td>
            <td class="sku">OF-3010</td>
            <td class="num low">12</td>
            <td class="num">15</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

</body>
</html>
